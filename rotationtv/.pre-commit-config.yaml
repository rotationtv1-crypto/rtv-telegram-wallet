# RotationTV — Pre-commit Secret Scanning
# Blocks any commit containing leaked secrets before it reaches git
# Entity: Darrel-spell-living-trust

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks
        name: Detect leaked secrets (API keys, tokens, passwords)
        # Custom rules for RTV-specific patterns
        args: ['--config', '.gitleaks.toml']

  - repo: local
    hooks:
      - id: rtv-secret-scan
        name: RTV custom secret scanner
        entry: bash .githooks/rtv-secret-scan.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false
