name: Security & Secret Audit

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Run Custom RTV Secret Scanner
        run: |
          # Scan for RTV-specific patterns
          patterns='(TELEGRAM_BOT_TOKEN|cfat_|cfut_|sk_V2_|eyJ[a-zA-Z0-9_-]{20,})[a-zA-Z0-9_-]{10,}'
          found=0
          while IFS= read -r file; do
            if grep -E -n "$patterns" "$file" 2>/dev/null; then
              echo "::error file=$file::Potential secret detected"
              found=1
            fi
          done < <(git diff --name-only HEAD~1 HEAD 2>/dev/null || find . -name "*.ts" -o -name "*.js" -o -name "*.json" | grep -v node_modules | grep -v dist)
          if [ "$found" -eq 1 ]; then
            echo "❌ Secrets detected — pipeline blocked"
            exit 1
          fi
          echo "✅ No secrets detected"
