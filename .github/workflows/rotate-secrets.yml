name: Rotate Secrets

on:
  workflow_dispatch:
    inputs:
      providers:
        description: "Comma list: cloudflare,github,wrangler,telegram,venice or all"
        required: true
        default: "telegram,venice"
      dry_run:
        description: "Dry run only (no changes)"
        type: boolean
        default: true
  schedule:
    # 1st of every month 06:00 UTC
    - cron: "0 6 1 * *"

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tools
        run: |
          npm install -g wrangler
          # gh is preinstalled on ubuntu-latest runners

      - name: Make scripts executable
        run: chmod +x scripts/rotate/*.sh

      - name: Run rotation orchestrator
        env:
          ROTATION_CF_API_TOKEN: ${{ secrets.ROTATION_CF_API_TOKEN }}
          ROTATION_GITHUB_TOKEN: ${{ secrets.ROTATION_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROTATION_NOTIFY_WEBHOOK: ${{ secrets.ROTATION_NOTIFY_WEBHOOK }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          PROVIDERS="${{ github.event.inputs.providers || 'telegram,venice' }}"
          DRY="${{ github.event.inputs.dry_run || 'true' }}"
          ARGS="--providers=$PROVIDERS"
          if [ "$DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          ./scripts/rotate/orchestrate.sh $ARGS

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-audit
          path: rotation-audit.log
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## Secret rotation run" >> $GITHUB_STEP_SUMMARY
          echo "Providers: ${{ github.event.inputs.providers || 'telegram,venice (schedule)' }}" >> $GITHUB_STEP_SUMMARY
          echo "Dry-run: ${{ github.event.inputs.dry_run || 'true' }}" >> $GITHUB_STEP_SUMMARY
          if [ -f rotation-audit.log ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat rotation-audit.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
