name: Cloudflare CI

on:
  push:
    branches: [main, "chore/**"]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --prefer-offline || npm install

      - name: Typecheck critical paths
        run: |
          npx tsc --noEmit --pretty false 2>&1 | head -80 || true
          # Focused check on payment + gateway surface
          test -f src/lib/telegramStars.ts
          test -f src/lib/telegramCloudSdk.ts
          test -f src/lib/botGateway.ts
          test -f src/hooks/useStarsPayment.ts

      - name: Build (Vite)
        run: npm run build --if-present
        continue-on-error: true

  # Deploy only when secrets exist — never claim live without them
  deploy-worker:
    needs: typecheck-and-build
    if: github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_API_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
      - name: Deploy via wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
